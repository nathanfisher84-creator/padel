<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--court-50:#f1f7f2;--court-100:#e0ede3;--court-200:#c2dbc9;--court-300:#9ac2a7;--court-400:#6da583;--court-500:#4b8765;--court-600:#35704f;--court-700:#2a5a40;--court-800:#234a36;--court-900:#1d3d2d;--court-950:#10241a;--ball-300:#e6ef86;--ball-400:#dce75f;--ball-500:#cfe23f;--ball-600:#7c8f0e;--slate-200:#e3dfd2;--slate-300:#cfc9b8;--slate-400:#a49d8a;--slate-500:#7f7867;--slate-600:#665f50;--slate-700:#4f483c;--slate-900:#23201a;--cream:#f8f4e9;--bone:#e5decd;--white:#fffefa}
*{margin:0;box-sizing:border-box}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--cream);color:var(--slate-900);padding:32px;-webkit-font-smoothing:antialiased}
.mono{font-family:'Spline Sans Mono',ui-monospace,monospace}
.eyebrow{font-family:'Spline Sans Mono',monospace;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.18em}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;font-stretch:118%}
.card{border:1px solid var(--slate-200);background:var(--white);border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(35,32,26,.05)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.label{font-size:12px;color:var(--slate-500);margin-top:6px}
</style><style>body{background:var(--cream)}</style></head><body>
<div style="background:var(--court-950);border-radius:24px;padding:48px;color:var(--white);position:relative;overflow:hidden">
 <div style="position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#fff3 1px,transparent 1px),linear-gradient(90deg,#fff3 1px,transparent 1px);background-size:56px 56px"></div>
 <div style="position:relative">
 <p class="eyebrow" style="color:var(--ball-400)">Padel video analysis · coaching marketplace</p>
 <div style="font-size:44px;font-weight:800;font-stretch:118%;line-height:1.05;margin-top:14px;max-width:560px">Hire a professional coach to review your padel game</div>
 <div style="margin-top:22px;display:flex;gap:12px">
  <span style="display:inline-flex;border-radius:8px;padding:10px 20px;font-weight:600;background:var(--ball-500);color:var(--court-950)">Browse coaches</span>
  <span style="display:inline-flex;border-radius:8px;padding:10px 20px;font-weight:600;border:1px solid var(--court-700);color:var(--white)">Join as a coach</span>
 </div>
 <div class="mono" style="margin-top:26px;font-size:13px;color:var(--court-300);display:flex;gap:28px"><span><span style="color:var(--ball-400)">3</span> verified coaches</span><span>Reviews from <span style="color:var(--ball-400)">€25</span></span></div>
 </div>
</div></body></html>

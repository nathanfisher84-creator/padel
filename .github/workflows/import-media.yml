name: Import generated media

# One-shot helper: downloads AI-generated assets from the generation CDN
# (unreachable from the authoring sandbox) and commits them into the repo
# as first-party files. Edit the download list per import run.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/padel-revenue-vercel-test-jg44m0

      - name: Download assets
        run: |
          B="https://d8j0ntlcm91z4.cloudfront.net/user_3CLWhZn1DyGWsC2KnvB3OhhaQ9X"
          curl -fsSL -o public/media/hero-ball.mp4 --create-dirs "$B/hf_20260711_054210_e507f229-49b1-43d2-8f87-07247eaf97e0.mp4"
          ls -la public/media

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media
          git commit -m "Add hero padel-ball macro loop video"
          git push
